name: Fetch FTWB YouTube data

on:
  schedule:
    # 22:30 UTC = 5:30 PM Central (CDT). 15 minutes ahead of the Claude job.
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch YouTube data
        run: |
          python3 - <<'PY'
          import json, os, re, datetime, urllib.request
          import xml.etree.ElementTree as ET

          CHANNEL = "UC6CJpFymqgNtEmKmFYL-qxw"
          FEED = "https://www.youtube.com/feeds/videos.xml?channel_id=" + CHANNEL
          UA = "Mozilla/5.0 (compatible; ftwb-relay/1.0)"

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          NS = {
              "a": "http://www.w3.org/2005/Atom",
              "yt": "http://www.youtube.com/xml/schemas/2015",
              "m": "http://search.yahoo.com/mrss/",
          }

          root = ET.fromstring(get(FEED))
          videos = []
          for e in root.findall("a:entry", NS):
              vid = e.findtext("yt:videoId", "", NS)
              if not vid:
                  continue
              title = e.findtext("a:title", "", NS)
              published = e.findtext("a:published", "", NS)
              grp = e.find("m:group", NS)
              desc = grp.findtext("m:description", "", NS) if grp is not None else ""
              views = ""
              if grp is not None:
                  comm = grp.find("m:community", NS)
                  if comm is not None:
                      stat = comm.find("m:statistics", NS)
                      if stat is not None:
                          views = stat.get("views", "")

              # Best effort duration from the watch page. Never fatal.
              seconds = None
              try:
                  html = get("https://www.youtube.com/watch?v=" + vid).decode("utf-8", "ignore")
                  m = re.search(r'"lengthSeconds":"(\d+)"', html)
                  if m:
                      seconds = int(m.group(1))
              except Exception as err:
                  print("duration lookup failed for", vid, err)

              videos.append({
                  "id": vid,
                  "title": title,
                  "description": desc,
                  "publishedAt": published,
                  "viewCount": views,
                  "durationSeconds": seconds,
                  "url": "https://www.youtube.com/watch?v=" + vid,
              })

          videos.sort(key=lambda x: x["publishedAt"], reverse=True)

          out = {
              "generatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "channelId": CHANNEL,
              "source": "youtube rss feed (no api key required)",
              "videoCount": len(videos),
              "videos": videos,
          }
          os.makedirs("data", exist_ok=True)
          with open("data/latest.json", "w") as f:
              json.dump(out, f, indent=2, ensure_ascii=False)
          print("wrote", len(videos), "videos")
          PY

      - name: Commit result
        run: |
          git config user.name "ftwb-relay-bot"
          git config user.email "actions@github.com"
          git add data/latest.json
          git diff --staged --quiet || git commit -m "Update YouTube data"
          git push
